<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script src="package/build/three.min.js"></script>
</head><body>
<script>
const W=1800,H=1125;
const params=new URLSearchParams(location.search);
const which=params.get('s')||'pilates';
const view=params.get('v')||'a';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(W,H);renderer.setPixelRatio(1);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:(o.map?'#ffffff':c),roughness:0.85,metalness:0},o));
function box(w,h,d,mat,x,y,z,parent){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;(parent||scene).add(m);return m;}
function cyl(rt,rb,h,mat,x,y,z,seg=24){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;}
function noiseTex(base,amp,size=256,lines=false,lineCol=null){
  const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');
  g.fillStyle=base;g.fillRect(0,0,size,size);
  const img=g.getImageData(0,0,size,size);
  for(let i=0;i<img.data.length;i+=4){const n=(Math.random()-0.5)*amp;img.data[i]+=n;img.data[i+1]+=n;img.data[i+2]+=n;}
  g.putImageData(img,0,0);
  if(lines){g.strokeStyle=lineCol;g.lineWidth=2;for(let y=0;y<size;y+=size/8){g.beginPath();g.moveTo(0,y);g.lineTo(size,y);g.stroke();}}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;return t;}
function limewash(base){const size=512;const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');
  g.fillStyle=base;g.fillRect(0,0,size,size);
  for(let i=0;i<260;i++){const x=Math.random()*size,y=Math.random()*size,r=20+Math.random()*90;
    const gr=g.createRadialGradient(x,y,0,x,y,r);const a=Math.random()*0.10;const l=Math.random()>0.5?255:0;
    gr.addColorStop(0,`rgba(${l},${l},${l},${a})`);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,2*r,2*r);}
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;}
function textTex(txt,font,col,w=1024,h=256){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  g.clearRect(0,0,w,h);g.font=font;g.fillStyle=col;g.textAlign='center';g.textBaseline='middle';g.fillText(txt,w/2,h/2);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;}
function plant(x,z,s=1,pot='#2a2a2a'){
  cyl(0.16*s,0.12*s,0.36*s,M(pot,{roughness:0.6}),x,0.18*s,z);
  const leaf=M('#1f4a2a',{roughness:0.7});const leaf2=M('#2d6b3a',{roughness:0.7});
  for(let i=0;i<14;i++){const g=new THREE.SphereGeometry(0.11*s,10,8);const m=new THREE.Mesh(g,i%2?leaf:leaf2);
    const a=i*2.4,r=0.05+0.16*s*Math.random();m.scale.set(1.4,0.55,0.9);
    m.position.set(x+Math.cos(a)*r,0.45*s+Math.random()*0.75*s,z+Math.sin(a)*r);m.rotation.set(Math.random(),a,Math.random()*0.6);m.castShadow=true;scene.add(m);}
}
function hanging(x,y,z){const leaf=M('#2d6b3a');for(let i=0;i<10;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(0.06,8,6),leaf);m.scale.set(1.3,0.5,1);m.position.set(x+(Math.random()-0.5)*0.25,y-i*0.07,z+(Math.random()-0.5)*0.15);scene.add(m);}}
const oak=M('#c08a52',{map:noiseTex('#c08a52',18,256,false),roughness:0.7});
const oakDark=M('#9c6a3a',{roughness:0.7});
const black=M('#151515',{roughness:0.5});
const metal=M('#bbbbbb',{metalness:0.8,roughness:0.3});


scene.background=new THREE.Color('#000');
const RW=6.25,RD=3.0,RH=2.9;
const sage=M('#a3b096',{roughness:0.95});
// floor light wood (trapezoid approximated by full rect; left wall covers the slant)
const fl=noiseTex('#c9a77c',16,512,true,'#b8946a');fl.repeat.set(3,1.5);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(RW+1,RD),M('#c9a77c',{map:fl,roughness:0.65}));floor.rotation.x=-Math.PI/2;floor.position.x=-0.5;floor.receiveShadow=true;scene.add(floor);
const ceil=new THREE.Mesh(new THREE.PlaneGeometry(RW+1,RD),M('#f2f0ec'));ceil.rotation.x=Math.PI/2;ceil.position.set(-0.5,RH,0);scene.add(ceil);
// back wall (window wall, z=-1.5) window at x 1.85..3.05 , y 1.0..2.3
const wx0=1.85,wx1=3.05;
box(wx0+3.4,RH,0.12,sage,(-3.4+wx0)/2,RH/2,-RD/2-0.06);
box(RW/2-wx1,RH,0.12,sage,(wx1+RW/2)/2,RH/2,-RD/2-0.06);
box(wx1-wx0,1.0,0.12,sage,(wx0+wx1)/2,0.5,-RD/2-0.06);box(wx1-wx0,RH-2.3,0.12,sage,(wx0+wx1)/2,(2.3+RH)/2,-RD/2-0.06);
box(wx1-wx0,0.05,0.14,black,(wx0+wx1)/2,1.0,-RD/2-0.05);box(wx1-wx0,0.05,0.14,black,(wx0+wx1)/2,2.3,-RD/2-0.05);
box(0.05,1.3,0.14,black,wx0,1.65,-RD/2-0.05);box(0.05,1.3,0.14,black,wx1,1.65,-RD/2-0.05);
const outside=new THREE.Mesh(new THREE.PlaneGeometry(4,3),new THREE.MeshBasicMaterial({color:'#e9f0f2'}));outside.position.set(2.4,1.6,-RD/2-1.0);scene.add(outside);
// left slanted wall: olive limewash + PILATES
const lw=M('#ffffff',{map:limewash('#7a8160'),roughness:1});
const ang=Math.atan2(0.52,3.0); // slant
const lwall=box(0.12,RH,3.06,lw,-2.93,RH/2,0);lwall.rotation.y=ang;
const txt=new THREE.Mesh(new THREE.PlaneGeometry(2.2,0.55),new THREE.MeshStandardMaterial({map:textTex('PILATES','bold 190px Arial','#121212'),transparent:true,roughness:0.6}));
txt.position.set(-2.86,1.95,0);txt.rotation.y=Math.PI/2+ang;scene.add(txt);
const lime=new THREE.Mesh(new THREE.PlaneGeometry(1.1,0.02),new THREE.MeshBasicMaterial({color:'#cad400'}));lime.position.set(-2.86,1.6,0);lime.rotation.y=Math.PI/2+ang;scene.add(lime);
// right wall: oak slats with hidden door (z 0.67..1.37)
box(0.06,RH,RD,M('#2b2b2b'),RW/2+0.03,RH/2,0);
for(let z=-RD/2+0.04;z<RD/2;z+=0.09){box(0.05,RH-0.02,0.045,oak,RW/2-0.03,RH/2,z);}
box(0.03,0.25,0.03,black,RW/2-0.08,1.05,0.75);
// front wall (z=+1.5) sage + mat rack with 4 mats
box(RW+1,RH,0.12,sage,-0.5,RH/2,RD/2+0.06);
box(2.0,0.05,0.08,oak,1.15,1.75,RD/2-0.04);
const matCols=['#1d1d1d','#5b6b55','#1d1d1d','#5b6b55'];
for(let i=0;i<4;i++){const x=0.4+i*0.5;box(0.03,0.03,0.1,black,x,1.72,RD/2-0.08);box(0.44,1.15,0.015,M(matCols[i],{roughness:0.8}),x,1.12,RD/2-0.12);}
// 1 Reformer with tower: body x -1.95..0.49, z center -0.65 ; tower at x -2.4
function reformer(x0,x1,zc){
  const L=x1-x0,Wd=0.65,xc=(x0+x1)/2;
  box(L,0.06,0.06,oak,xc,0.32,zc-Wd/2+0.03);box(L,0.06,0.06,oak,xc,0.32,zc+Wd/2-0.03);
  box(0.06,0.06,Wd,oak,x0+0.03,0.32,zc);box(0.06,0.06,Wd,oak,x1-0.03,0.32,zc);
  for(const xx of [x0+0.05,x1-0.05])for(const zz of [zc-Wd/2+0.05,zc+Wd/2-0.05])box(0.06,0.29,0.06,oakDark,xx,0.145,zz);
  box(L-0.2,0.02,Wd-0.1,M('#8a8a8a',{metalness:0.6,roughness:0.4}),xc,0.3,zc);
  box(0.75,0.08,Wd-0.16,M('#1b1b1b',{roughness:0.55}),xc+0.35,0.4,zc);
  box(0.14,0.1,0.18,M('#1b1b1b'),xc-0.02,0.49,zc-0.13);box(0.14,0.1,0.18,M('#1b1b1b'),xc-0.02,0.49,zc+0.13);
  box(0.18,0.07,0.3,M('#1b1b1b'),xc+0.7,0.47,zc);
  const fb=new THREE.Mesh(new THREE.TorusGeometry(0.28,0.017,8,24,Math.PI),metal);fb.position.set(x0+0.25,0.38,zc);fb.rotation.y=Math.PI/2;fb.castShadow=true;scene.add(fb);
  for(let i=0;i<4;i++){const s=cyl(0.012,0.012,0.4,M('#cad400',{roughness:0.4}),xc-0.45,0.36,zc-0.15+i*0.1);s.rotation.z=Math.PI/2;}
}
reformer(-1.95,0.49,-0.65);
// tower: two uprights at x -2.35, z -0.65±0.38, h 2.05; top crossbar; push-through bar; hanging springs
const tw=M('#e8e2d6',{roughness:0.5});
box(0.06,2.05,0.06,tw,-2.35,1.025,-1.03);box(0.06,2.05,0.06,tw,-2.35,1.025,-0.27);
box(0.06,0.06,0.82,tw,-2.35,2.05,-0.65);
box(0.4,0.05,0.05,tw,-2.15,2.05,-1.03);box(0.4,0.05,0.05,tw,-2.15,2.05,-0.27);
box(0.05,0.05,0.7,metal,-2.05,1.35,-0.65); // push-through bar
for(const z of [-0.95,-0.35]){const s=cyl(0.012,0.012,0.55,M('#cad400'),-2.0,1.75,z);}
box(0.5,0.05,0.82,oak,-2.2,0.36,-0.65); // tower base mat platform
// 2 Step chair (Wunda) center x -0.69, z 0.98
box(0.7,0.55,0.62,oak,-0.69,0.3,0.98);
box(0.72,0.06,0.64,M('#1b1b1b',{roughness:0.55}),-0.69,0.6,0.98);
box(0.05,0.05,0.6,metal,-1.08,0.28,0.98); // pedal
box(0.04,0.3,0.04,metal,-1.06,0.15,0.72);box(0.04,0.3,0.04,metal,-1.06,0.15,1.24);
for(let i=0;i<2;i++){const s=cyl(0.012,0.012,0.25,M('#cad400'),-0.9,0.2,0.85+i*0.26);s.rotation.z=Math.PI/2;}
// 3 Ladder barrel center x 2.06 ; ladder at z -1.05, barrel at z -0.3
box(0.62,0.08,1.2,oak,2.06,0.04,-0.5);
const barrel=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,0.6,24,1,false,0,Math.PI),M('#1b1b1b',{roughness:0.55}));
barrel.rotation.z=Math.PI/2;barrel.rotation.y=Math.PI/2;barrel.position.set(2.06,0.5,-0.25);barrel.rotation.set(0,0,0);
barrel.geometry.rotateZ(Math.PI/2);barrel.geometry.rotateY(Math.PI/2);barrel.position.set(2.06,0.48,-0.25);barrel.castShadow=true;scene.add(barrel);
box(0.6,0.4,0.84,oak,2.06,0.27,-0.25);
for(const x of [1.78,2.34]) box(0.05,1.05,0.05,oak,x,0.55,-1.05);
for(let i=0;i<5;i++) box(0.56,0.035,0.035,oak,2.06,0.25+i*0.19,-1.05);
// plant + balls
plant(-2.3,1.2,1.1,'#d9d3c7');plant(2.8,-1.2,1.3,'#d9d3c7');
const ballM=M('#9fd3ee',{roughness:0.35});
const b1=new THREE.Mesh(new THREE.SphereGeometry(0.32,32,24),ballM);b1.position.set(2.45,0.32,1.0);b1.castShadow=true;scene.add(b1);
const b2=new THREE.Mesh(new THREE.SphereGeometry(0.32,32,24),ballM);b2.position.set(1.85,0.32,1.15);b2.castShadow=true;scene.add(b2);
hanging(2.1,2.75,-1.4);
box(1.1,0.03,0.22,oak,2.45,2.5,-RD/2+0.12);
const led=new THREE.Mesh(new THREE.BoxGeometry(4.6,0.02,0.05),new THREE.MeshBasicMaterial({color:'#ffffff'}));led.position.set(-0.3,RH-0.02,0);scene.add(led);
scene.add(new THREE.HemisphereLight('#ffffff','#b8a68e',0.8));
const sun=new THREE.DirectionalLight('#fff4e6',1.1);sun.position.set(3.5,2.6,-5);sun.target.position.set(1,0,0.5);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-5,right:5,top:5,bottom:-5});scene.add(sun);scene.add(sun.target);
const p1=new THREE.PointLight('#fff1dd',6,7,1.6);p1.position.set(-0.5,2.7,0);scene.add(p1);
const p2=new THREE.PointLight('#fff1dd',4,6,1.8);p2.position.set(1.8,2.6,0.6);scene.add(p2);
var cam=new THREE.PerspectiveCamera(66,W/H,0.05,50);
if(view==='a'){cam.fov=74;cam.updateProjectionMatrix();cam.position.set(3.0,2.55,1.35);cam.lookAt(-0.9,0.45,-0.5);}
else{cam.position.set(-2.0,2.5,-1.2);cam.lookAt(1.3,0.7,0.9);}
renderer.render(scene,cam);
window.DONE=true;
</script></body></html>
