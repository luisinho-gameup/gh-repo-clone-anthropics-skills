<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script src="package/build/three.min.js"></script>
</head><body>
<script>
const W=1800,H=1125;
const params=new URLSearchParams(location.search);
const which=params.get('s')||'pilates';
const view=params.get('v')||'a';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(W,H);renderer.setPixelRatio(1);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:(o.map?'#ffffff':c),roughness:0.85,metalness:0},o));
function box(w,h,d,mat,x,y,z,parent){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;(parent||scene).add(m);return m;}
function cyl(rt,rb,h,mat,x,y,z,seg=24){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;}
function noiseTex(base,amp,size=256,lines=false,lineCol=null){
  const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');
  g.fillStyle=base;g.fillRect(0,0,size,size);
  const img=g.getImageData(0,0,size,size);
  for(let i=0;i<img.data.length;i+=4){const n=(Math.random()-0.5)*amp;img.data[i]+=n;img.data[i+1]+=n;img.data[i+2]+=n;}
  g.putImageData(img,0,0);
  if(lines){g.strokeStyle=lineCol;g.lineWidth=2;for(let y=0;y<size;y+=size/8){g.beginPath();g.moveTo(0,y);g.lineTo(size,y);g.stroke();}}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;return t;}
function limewash(base){const size=512;const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');
  g.fillStyle=base;g.fillRect(0,0,size,size);
  for(let i=0;i<260;i++){const x=Math.random()*size,y=Math.random()*size,r=20+Math.random()*90;
    const gr=g.createRadialGradient(x,y,0,x,y,r);const a=Math.random()*0.10;const l=Math.random()>0.5?255:0;
    gr.addColorStop(0,`rgba(${l},${l},${l},${a})`);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,2*r,2*r);}
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;}
function textTex(txt,font,col,w=1024,h=256){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  g.clearRect(0,0,w,h);g.font=font;g.fillStyle=col;g.textAlign='center';g.textBaseline='middle';g.fillText(txt,w/2,h/2);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;}
function plant(x,z,s=1,pot='#2a2a2a'){
  cyl(0.16*s,0.12*s,0.36*s,M(pot,{roughness:0.6}),x,0.18*s,z);
  const leaf=M('#1f4a2a',{roughness:0.7});const leaf2=M('#2d6b3a',{roughness:0.7});
  for(let i=0;i<14;i++){const g=new THREE.SphereGeometry(0.11*s,10,8);const m=new THREE.Mesh(g,i%2?leaf:leaf2);
    const a=i*2.4,r=0.05+0.16*s*Math.random();m.scale.set(1.4,0.55,0.9);
    m.position.set(x+Math.cos(a)*r,0.45*s+Math.random()*0.75*s,z+Math.sin(a)*r);m.rotation.set(Math.random(),a,Math.random()*0.6);m.castShadow=true;scene.add(m);}
}
function hanging(x,y,z){const leaf=M('#2d6b3a');for(let i=0;i<10;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(0.06,8,6),leaf);m.scale.set(1.3,0.5,1);m.position.set(x+(Math.random()-0.5)*0.25,y-i*0.07,z+(Math.random()-0.5)*0.15);scene.add(m);}}
const oak=M('#c08a52',{map:noiseTex('#c08a52',18,256,false),roughness:0.7});
const oakDark=M('#9c6a3a',{roughness:0.7});
const black=M('#151515',{roughness:0.5});
const metal=M('#bbbbbb',{metalness:0.8,roughness:0.3});

if(which==='pilates'){
  scene.background=new THREE.Color('#000');
  const RW=4.45,RD=4.10,RH=2.9;
  const sage=M('#a3b096',{roughness:0.95});
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(RW,RD),M('#d6d0c4',{map:noiseTex('#d6d0c4',14,512),roughness:0.6}));
  floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
  const ceil=new THREE.Mesh(new THREE.PlaneGeometry(RW,RD),M('#f2f0ec'));ceil.rotation.x=Math.PI/2;ceil.position.y=RH;scene.add(ceil);
  // back wall (window) z=-RD/2 ; left wall x=-RW/2 (oak slats + hidden door) ; right wall x=+RW/2 (olive limewash accent)
  // back wall with window opening 2.1 wide, from y=1.0 to 2.3
  const wb=new THREE.Group();scene.add(wb);
  box(RW,1.0,0.12,sage,0,0.5,-RD/2-0.06);box(RW,RH-2.3,0.12,sage,0,(2.3+RH)/2,-RD/2-0.06);
  box((RW-2.1)/2,1.3,0.12,sage,-(RW/2-(RW-2.1)/4),1.65,-RD/2-0.06);box((RW-2.1)/2,1.3,0.12,sage,(RW/2-(RW-2.1)/4),1.65,-RD/2-0.06);
  // window frame + glass + outside light
  box(2.1,0.05,0.14,black,0,1.0,-RD/2-0.05);box(2.1,0.05,0.14,black,0,2.3,-RD/2-0.05);box(0.05,1.3,0.14,black,-1.05,1.65,-RD/2-0.05);box(0.05,1.3,0.14,black,1.05,1.65,-RD/2-0.05);box(0.04,1.3,0.1,black,0,1.65,-RD/2-0.05);
  const outside=new THREE.Mesh(new THREE.PlaneGeometry(6,3),new THREE.MeshBasicMaterial({color:'#e9f0f2'}));outside.position.set(0,1.6,-RD/2-1.2);scene.add(outside);
  // window bench oak under window
  box(2.0,0.06,0.4,oak,0,0.48,-RD/2+0.22);box(0.06,0.45,0.36,oak,-0.95,0.23,-RD/2+0.22);box(0.06,0.45,0.36,oak,0.95,0.23,-RD/2+0.22);
  // rolled towels on bench
  for(let i=0;i<3;i++){const t=cyl(0.07,0.07,0.32,M('#f4f2ee'),0.45+i*0.17,0.58,-RD/2+0.22);t.rotation.z=Math.PI/2;}
  // left wall: oak slats continuous
  box(0.06,RH,RD,M('#2b2b2b'),-RW/2-0.03,RH/2,0);
  for(let z=-RD/2+0.04;z<RD/2;z+=0.09){box(0.05,RH-0.02,0.045,oak,-RW/2+0.03,RH/2,z);}
  box(0.03,0.25,0.03,black,-RW/2+0.08,1.05,0.9); // hidden door handle
  // right wall: olive limewash accent with PILATES letters
  const lw=M('#ffffff',{map:limewash('#7a8160'),roughness:1});
  box(0.12,RH,RD,lw,RW/2+0.06,RH/2,0);
  const txt=new THREE.Mesh(new THREE.PlaneGeometry(2.4,0.6),new THREE.MeshStandardMaterial({map:textTex('PILATES','bold 190px Arial','#121212'),transparent:true,roughness:0.6}));
  txt.position.set(RW/2-0.01,1.95,0.15);txt.rotation.y=-Math.PI/2;scene.add(txt);
  const lime=new THREE.Mesh(new THREE.PlaneGeometry(1.2,0.02),new THREE.MeshBasicMaterial({color:'#cad400'}));lime.position.set(RW/2-0.012,1.58,0.15);lime.rotation.y=-Math.PI/2;scene.add(lime);
  // front wall (behind camera) sage
  box(RW,RH,0.12,sage,0,RH/2,RD/2+0.06);
  // reformers x3, oriented along z
  function reformer(x){
    const L=2.4,Wd=0.65;
    box(0.06,0.06,L,oak,x-Wd/2+0.03,0.32,0);box(0.06,0.06,L,oak,x+Wd/2-0.03,0.32,0);
    box(Wd,0.06,0.06,oak,x,0.32,-L/2+0.03);box(Wd,0.06,0.06,oak,x,0.32,L/2-0.03);
    for(const zz of [-L/2+0.05,L/2-0.05])for(const xx of [x-Wd/2+0.05,x+Wd/2-0.05])box(0.06,0.29,0.06,oakDark,xx,0.145,zz);
    box(Wd-0.1,0.02,L-0.2,M('#8a8a8a',{metalness:0.6,roughness:0.4}),x,0.3,0); // rails
    box(Wd-0.16,0.08,0.75,M('#1b1b1b',{roughness:0.55}),x,0.4,0.25); // carriage
    box(0.18,0.1,0.14,M('#1b1b1b'),x-0.13,0.49,-0.06);box(0.18,0.1,0.14,M('#1b1b1b'),x+0.13,0.49,-0.06); // shoulder blocks
    box(0.3,0.07,0.18,M('#1b1b1b'),x,0.47,0.55); // headrest
    // footbar
    const fb=new THREE.Mesh(new THREE.TorusGeometry(0.28,0.017,8,24,Math.PI),metal);fb.position.set(x,0.38,-L/2+0.25);fb.castShadow=true;scene.add(fb);
    // springs
    for(let i=0;i<4;i++){const s=cyl(0.012,0.012,0.4,M('#cad400',{roughness:0.4}),x-0.15+i*0.1,0.36,-0.4);s.rotation.x=Math.PI/2;}
    box(Wd-0.1,0.04,0.04,metal,x,0.36,-L/2+0.08); // spring bar
    // straps/loops
    for(const s of [-1,1]){box(0.02,0.02,0.6,black,x+s*0.2,0.5,0.95);}
  }
  reformer(-1.15);reformer(0);reformer(1.15);
  // plants
  plant(1.75,-1.6,1.2,'#d9d3c7');plant(-1.75,-1.65,1.0,'#2a2a2a');plant(1.85,1.55,1.4,'#d9d3c7');
  hanging(-0.9,2.75,-1.9);hanging(0.9,2.75,-1.9);
  box(1.6,0.03,0.22,oak,0,2.55,-RD/2+0.12);  // shelf over window
  // LED strip ceiling
  const led=new THREE.Mesh(new THREE.BoxGeometry(3.4,0.02,0.05),new THREE.MeshBasicMaterial({color:'#ffffff'}));led.position.set(0,RH-0.02,0.3);scene.add(led);
  // lights
  scene.add(new THREE.HemisphereLight('#ffffff','#b8b0a2',0.75));
  const sun=new THREE.DirectionalLight('#fff4e6',1.2);sun.position.set(-1.0,2.8,-5);sun.target.position.set(0,0,0.5);sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-4,right:4,top:4,bottom:-4});scene.add(sun);scene.add(sun.target);
  const p1=new THREE.PointLight('#fff1dd',6,6,1.6);p1.position.set(0,2.7,0.3);scene.add(p1);
  const p2=new THREE.PointLight('#fff1dd',3,5,2);p2.position.set(1.6,2.5,1.2);scene.add(p2);
  var cam=new THREE.PerspectiveCamera(62,W/H,0.05,50);
  if(view==='a'){cam.position.set(-1.7,1.65,1.95);cam.lookAt(0.6,1.0,-1.3);}
  else{cam.position.set(1.6,2.6,2.0);cam.lookAt(-0.3,0.4,-0.6);}
}

if(which==='recovery'){
  scene.background=new THREE.Color('#a9cbe8');
  scene.fog=new THREE.Fog('#cfe2f0',25,60);
  // coordinates: building facade along z=0 (x from 0 to 17), terrace extends to -z. Corner left at x=0.
  // terrace floor (membrane dark grey) + wood deck zone 5.2 x 2.5 next to facade at left
  const memb=new THREE.Mesh(new THREE.PlaneGeometry(17,9),M('#7c8084',{map:noiseTex('#7c8084',22,512,true,'#6a6d70'),roughness:0.95}));
  memb.rotation.x=-Math.PI/2;memb.position.set(8.5,0,-4.5);memb.receiveShadow=true;scene.add(memb);
  const deckMat=M('#a86f3d',{roughness:0.75});
  for(let x=0.1;x<5.3;x+=0.145){box(0.13,0.04,2.6,deckMat,x,0.04,-1.3);}
  // facade (brick lower, cream upper) z=0, behind is building; window of the Sala at x 1.2..3.3
  const brick=M('#b8623a',{map:noiseTex('#b8623a',20,256,true,'#9a4e2c'),roughness:0.9});
  const cream=M('#eee6d0');
  box(17,1.0,0.3,brick,8.5,0.5,0.15);
  box(1.2,1.3,0.3,brick,0.6,1.65,0.15);box(17-3.3,1.3,0.3,brick,3.3+(17-3.3)/2,1.65,0.15);
  box(17,3.2,0.3,cream,8.5,2.3+1.6,0.15);
  // window of pilates room (Sala) with black frame
  box(2.1,0.05,0.1,black,2.25,1.0,0.0);box(2.1,0.05,0.1,black,2.25,2.3,0.0);box(0.05,1.3,0.1,black,1.2,1.65,0);box(0.05,1.3,0.1,black,3.3,1.65,0);box(0.04,1.3,0.08,black,2.25,1.65,0);
  const gl=new THREE.Mesh(new THREE.PlaneGeometry(2.05,1.25),M('#9fb3bf',{metalness:0.4,roughness:0.15}));gl.position.set(2.25,1.65,0.02);scene.add(gl);
  // other windows along facade
  for(const x of [5.2,7.6,10.0,12.4]){box(1.6,1.1,0.05,M('#9fb3bf',{metalness:0.4,roughness:0.15}),x,1.75,0.02);box(1.7,0.05,0.08,black,x,1.2,0.0);box(1.7,0.05,0.08,black,x,2.3,0.0);}
  // boundary walls: left wall x=0 going to -z, back wall slanted
  const wallC=M('#ece4cc',{roughness:0.95});
  box(0.2,2.0,4.8,wallC,-0.1,1.0,-2.4);
  // back wall from (0,-4.6) to (13,-8.7) approx -> make a long wall rotated
  const bw=box(13.6,2.0,0.2,wallC,6.5,1.0,-6.7);bw.rotation.y=Math.atan2(4.1,13);
  // vertical green wall on left boundary wall (biohacking)
  const gw=box(0.08,1.6,2.2,M('#24502c',{roughness:0.9}),0.05,1.15,-1.25);
  for(let i=0;i<160;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(0.07,8,6),M(i%3?'#2f6b3a':'#3f8a48'));m.scale.set(1,1.2,1.6);m.position.set(0.12,0.38+Math.random()*1.55,-0.18-Math.random()*2.15);scene.add(m);}
  // pergola: posts at 4 corners of deck, height 2.6, dark aluminium; roof translucent polycarbonate sloped slightly
  const alu=M('#3a3d40',{metalness:0.5,roughness:0.45});
  const px=[0.15,5.15],pz=[-0.15,-2.55],PH=2.6;
  box(0.1,PH,0.1,alu,5.15,PH/2,-2.55);box(0.1,PH,0.1,alu,0.15,PH/2,-2.55);
  box(5.2,0.14,0.1,alu,2.65,PH,-2.55);box(5.2,0.14,0.1,alu,2.65,PH+0.05,-0.12);
  box(0.1,0.14,2.5,alu,0.15,PH+0.03,-1.33);box(0.1,0.14,2.5,alu,5.15,PH+0.03,-1.33);
  for(let x=0.15;x<=5.16;x+=0.835){box(0.05,0.08,2.45,alu,x,PH+0.1,-1.33);}
  const pc=new THREE.Mesh(new THREE.BoxGeometry(5.2,0.02,2.5),new THREE.MeshStandardMaterial({color:'#f3f5f6',transparent:true,opacity:0.55,roughness:0.3}));
  pc.position.set(2.65,PH+0.15,-1.33);pc.receiveShadow=true;scene.add(pc);
  // sauna (wood box) at left corner
  const cedar=M('#b9824e',{map:noiseTex('#b9824e',16,256,true,'#946437'),roughness:0.7});
  box(1.2,1.95,1.05,cedar,0.85,0.975+0.06,-1.95);
  box(0.6,1.6,0.03,M('#2a2a2a',{transparent:true,opacity:0.65,metalness:0.3,roughness:0.1}),1.05,0.95,-1.41);
  box(1.26,0.06,1.1,cedar,0.85,2.06,-1.95);
  // ice bath black with oak step
  box(1.65,0.7,0.8,M('#141414',{roughness:0.35}),2.75,0.41,-2.0);
  const water=new THREE.Mesh(new THREE.PlaneGeometry(1.5,0.66),M('#9fd2e6',{metalness:0.2,roughness:0.05,transparent:true,opacity:0.85}));water.rotation.x=-Math.PI/2;water.position.set(2.75,0.72,-2.0);scene.add(water);
  box(0.9,0.2,0.35,oak,2.75,0.16,-1.42);
  box(0.4,0.45,0.35,M('#1e1e1e'),3.85,0.29,-2.1); // chiller
  // outdoor shower: post + rain head + slatted tray + glass screen
  box(1.1,0.05,1.1,deckMat,4.55,0.08,-1.85);
  box(0.06,2.25,0.06,black,4.95,1.18,-2.3);box(0.5,0.04,0.04,black,4.72,2.28,-2.3);cyl(0.13,0.13,0.02,black,4.5,2.25,-2.3);
  box(0.02,1.9,1.0,new THREE.MeshStandardMaterial({color:'#4b5257',transparent:true,opacity:0.18,roughness:0.1}),4.0,1.03,-1.85);
  // bench oak along facade + towels
  box(2.2,0.06,0.45,oak,2.4,0.47,-0.45);box(0.07,0.42,0.4,oak,1.4,0.25,-0.45);box(0.07,0.42,0.4,oak,3.4,0.25,-0.45);
  for(let i=0;i<3;i++){const t=cyl(0.08,0.08,0.38,M('#f4f2ee'),2.6+i*0.2,0.58,-0.45);t.rotation.z=Math.PI/2;}
  // plants in pots
  plant(0.45,-0.4,1.1,'#2a2a2a');plant(5.6,-2.7,1.6,'#d9d3c7');
  hanging(1.3,PH,-1.0);hanging(3.3,PH,-1.0);hanging(2.3,PH,-2.1);
  // warm LED strip under pergola beam
  const led=new THREE.Mesh(new THREE.BoxGeometry(5.0,0.02,0.04),new THREE.MeshBasicMaterial({color:'#ffe8c2'}));led.position.set(2.65,PH-0.08,-2.5);scene.add(led);
  // lights
  scene.add(new THREE.HemisphereLight('#dfefff','#6c6458',0.9));
  const sun=new THREE.DirectionalLight('#fff3df',2.2);sun.position.set(9,12,-6);sun.target.position.set(2.5,0,-1.5);sun.castShadow=true;
  sun.shadow.mapSize.set(3072,3072);Object.assign(sun.shadow.camera,{left:-10,right:10,top:10,bottom:-10});scene.add(sun);scene.add(sun.target);
  var cam=new THREE.PerspectiveCamera(58,W/H,0.05,100);
  if(view==='a'){cam.fov=70;cam.updateProjectionMatrix();cam.position.set(3.6,1.6,-5.0);cam.lookAt(2.3,1.1,-1.2);}
  else{cam.position.set(5.6,4.6,-6.2);cam.lookAt(2.3,0.6,-1.2);}
}
renderer.render(scene,cam);
window.DONE=true;
</script></body></html>
